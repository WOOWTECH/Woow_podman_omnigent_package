# .github/workflows/scripts-ci.yml: repo-specific script checks, next to the vendored
# quadlet-ci.yml (which is checksummed against scripts/lib/quadlet-lib.manifest, so
# repo-specific jobs live here instead).
#
# tests/converge-model.sh drives scripts/converge-lib.sh - the helpers scripts/converge.sh is
# built from - plus the real ql_install_files / ql_apply_units, against the doubles in
# tests/shims (podman, systemctl). No container is created and the runner's user manager is
# never touched. The central assertion is the one that defines a finished converge: the second
# run writes no file and restarts no unit.
name: scripts-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  converge-model:
    runs-on: ubuntu-24.04 # apt podman = 4.9.3, systemd 255: same as the WOOWTECH hosts
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version | sed -n 2p

      - name: shellcheck the test doubles
        run: shellcheck -x tests/shims/podman tests/shims/systemctl

      - name: Converge model (drift, backup, downtime, "the second run changes nothing")
        run: tests/converge-model.sh
