name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: woow-omnigent-runner
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive per-arch tags
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Per-arch images keep the `-${arch}` suffix so audit / rollback can
          # still pin a specific architecture. The unified multi-arch manifest
          # (no suffix) is composed in the `manifest` job below.
          BASE="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}-${{ matrix.arch }}"
          TAGS="${BASE}:main-${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS},${BASE}:${{ github.event.release.tag_name }},${BASE}:latest"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${BASE}:main"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build (+ push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.runner
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ github.event.release.tag_name || github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    # Compose the two per-arch images published by `build` into a single
    # multi-arch manifest list at `ghcr.io/<owner>/woow-omnigent-runner:<tag>`
    # (no arch suffix). Consumers (k3s chart, docker run) can then use one tag
    # and the runtime picks the matching architecture automatically.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose multi-arch manifest lists
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"
          SHA7="${GITHUB_SHA::7}"

          # Sources: the per-arch tags we just pushed in the `build` job.
          SRC_AMD64="${BASE}-amd64:main-${SHA7}"
          SRC_ARM64="${BASE}-arm64:main-${SHA7}"

          # Every push gets an immutable `:main-<sha>` manifest for rollback.
          TARGETS=("${BASE}:main-${SHA7}")

          if [ "${{ github.event_name }}" = "release" ]; then
            TARGETS+=("${BASE}:${{ github.event.release.tag_name }}" "${BASE}:latest")
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGETS+=("${BASE}:main")
          fi

          for TARGET in "${TARGETS[@]}"; do
            echo "==> Creating manifest list: ${TARGET}"
            docker buildx imagetools create \
              --tag "${TARGET}" \
              "${SRC_AMD64}" \
              "${SRC_ARM64}"
          done

          echo "==> Verifying primary manifest"
          docker buildx imagetools inspect "${TARGETS[0]}"
